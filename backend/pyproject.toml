[project]
name = "insightflow"
version = "0.1.0"
description = "InsightFlow API: soru + şema alır, doğrulanmış DuckDB SQL döner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "pydantic-settings>=2.15.0",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# Yalnızca scripts/bench_pandas_vs_duckdb.py için; imaja ve CI testlerine girmez.
bench = [
    "pandas>=3.0",
    "psutil>=7.0",
    "pyarrow>=21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
